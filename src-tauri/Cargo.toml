[package]
name = "grindr-api-dev-tool"
version = "1.2.1"
description = "Grindr API developer tool"
authors = ["Open Grind Governance (https://opengrind.org/governance)"]
homepage = "https://opengrind.org"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grindr_api_dev_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grindr = "0.32.1"
wreq = { version = "0.15", features = ["gzip", "json"] }
tokio = { version = "1", features = [
	"sync",
	"rt-multi-thread",
	"macros",
	"time",
	"fs",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
	"std",
	"NSTextCheckingClient",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
	"std",
	"NSDictionary",
	"NSObject",
	"NSString",
	"NSUserDefaults",
	"NSValue",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
	"std",
	"WKWebViewConfiguration",
] }
